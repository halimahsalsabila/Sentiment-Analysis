<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRAB+JbJ0B5X2o2f5AlG6uWq0w1bDq5nWLfch9a6w5VeeJS99phmQfjhZ" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f8ff;
            font-family: 'Arial', sans-serif;
        }
        .navbar {
            margin-bottom: 20px;
        }
        .header-text {
            color: #28a745;
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .btn-custom {
            background-color: #28a745;
            color: white;
            font-size: 1.1rem;
            border-radius: 10px;
            padding: 10px 20px;
        }
        .btn-custom:hover {
            background-color: #218838;
            transition: background-color 0.3s ease;
        }
        .menu-item {
            font-size: 1.2rem;
            margin: 15px 0;
        }
        .card {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Sentiment Analysis</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Evaluate Model</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Upload Dataset</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="header-text">Welcome to Sentiment Analysis</div>
        <p class="text-center">Use the menu to navigate through the website.</p>
        
        <div class="card">
            <div class="card-body">
                <h5 class="card-title text-center">Main Menu</h5>
                <div class="menu-item text-center">
                    <button class="btn btn-custom">Go to Home Page <i class="fas fa-home"></i></button>
                </div>
                <div class="menu-item text-center">
                    <button class="btn btn-custom">Go to Dashboard <i class="fas fa-tachometer-alt"></i></button>
                </div>
                <div class="menu-item text-center">
                    <button class="btn btn-custom">Evaluate Model <i class="fas fa-chart-line"></i></button>
                </div>
                <div class="menu-item text-center">
                    <button class="btn btn-custom">Upload Dataset <i class="fas fa-cloud-upload-alt"></i></button>
                </div>
            </div>
        </div>
    </div>
